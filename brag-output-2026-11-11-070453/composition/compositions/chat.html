  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const pop = (sel, at, origin) =>
        tl.fromTo(sel, { opacity: 0, scale: 0.5, transformOrigin: origin }, { opacity: 1, scale: 1, duration: 0.4, ease: "pop" }, at);
      // Words arrive at reading pace, 0.3 s apart (about 200 words a minute), and stay.
      const words = (sel, at) =>
        tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.3, ease: "power2.out" }, at);

      // The chat arrives in the middle of the frame: the hook is the conversation itself.
      tl.fromTo("#chat-wrap", { x: -410, y: 60, opacity: 0 }, { x: -410, y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0);
      // Each message gets its reading time (0.5 s + 0.3 s a word) before the next.
      pop("#chat-m1", 0.34, "100% 100%");
      pop("#chat-m2", 2.905, "0% 100%");
      tl.fromTo("#chat-typing", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 6.1);
      tl.fromTo(".chat-dot", { opacity: 0.35, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.1 }, 6.1);
      tl.to("#chat-typing", { opacity: 0, duration: 0.08 }, 6.93);
      pop("#chat-m3", 7.007, "100% 100%");

      // The twist: a quantum computer joins, and the key's lock opens. beat-locked: 10.08, where the music's beat drops in.
      pop("#chat-sys", 10.084, "50% 50%");
      tl.to("#chat-frame", { keyframes: [{ x: -6, duration: 0.05 }, { x: 6, duration: 0.06 }, { x: -3, duration: 0.06 }, { x: 0, duration: 0.08 }], ease: "power2.out" }, 10.084);
      tl.to("#chat-lock", { opacity: 0, duration: 0.12 }, 10.597);
      tl.fromTo("#chat-open", { opacity: 0, scale: 0.6, transformOrigin: "100% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "pop" }, 10.597);
      tl.to("#chat-key", { keyframes: [{ rotation: -3, duration: 0.06 }, { rotation: 2, duration: 0.08 }, { rotation: 0, duration: 0.12 }], ease: "power2.out" }, 10.597);

      // Once the twist has been read, the chat steps aside for what it means.
      tl.to("#chat-wrap", { x: 0, duration: 0.6, ease: "power2.inOut" }, 13.161);
      words("#chat-cap1 span", 13.5); // last word lands 16.4
      words("#chat-cap2 span", 16.9); // last word lands 18.9
      // Held 2 s after the last word, then out (20.9–21.12).
      tl.to("#chat-content", { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, 20.9);
      window.__timelines["chat"] = tl;
    })();
  </script>
