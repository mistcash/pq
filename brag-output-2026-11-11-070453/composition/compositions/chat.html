  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const pop = (sel, at, origin) =>
        tl.fromTo(sel, { opacity: 0, scale: 0.5, transformOrigin: origin }, { opacity: 1, scale: 1, duration: 0.4, ease: "pop" }, at);
      // Words arrive at reading pace, 0.3 s apart (about 200 words a minute), and stay.
      const words = (sel, at) =>
        tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.3, ease: "power2.out" }, at);

      // The chat arrives in the middle of the frame: the hook is the conversation itself.
      tl.fromTo("#chat-wrap", { x: -410, y: 60, opacity: 0 }, { x: -410, y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0);
      // Each message gets its reading time (0.5 s + 0.3 s a word) before the next.
      pop("#chat-m1", 0.34, "100% 100%");
      pop("#chat-m2", 2.39, "0% 100%");
      tl.fromTo("#chat-typing", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 4.7);
      tl.fromTo(".chat-dot", { opacity: 0.35, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.1 }, 4.7);
      tl.to("#chat-typing", { opacity: 0, duration: 0.08 }, 5.42);
      pop("#chat-m3", 5.47, "100% 100%");

      // The twist: a quantum computer joins. beat-locked: 7.52, where the music's beat drops in.
      pop("#chat-sys", 7.52, "50% 50%");
      tl.to("#chat-frame", { keyframes: [{ x: -6, duration: 0.05 }, { x: 6, duration: 0.06 }, { x: -3, duration: 0.06 }, { x: 0, duration: 0.08 }], ease: "power2.out" }, 7.52);
      // A beat later it replies to Alice's key, and the thread scrolls up to make room (84 px, measured with fonts loaded).
      pop("#chat-qc", 8.033, "0% 100%");
      tl.to("#chat-thread", { y: -84, duration: 0.35, ease: "power2.out" }, 8.033);
      tl.to("#chat-key", { keyframes: [{ rotation: -3, duration: 0.06 }, { rotation: 2, duration: 0.08 }, { rotation: 0, duration: 0.12 }], ease: "power2.out" }, 8.033);
      // What leaked, one line a beat: 8.55 / 9.06 / 9.57.
      tl.fromTo(".chat-leak", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out", stagger: 0.513 }, 8.546);

      // Held 2 s once the leak is read, then the chat steps aside for what it means.
      tl.to("#chat-wrap", { x: 0, duration: 0.6, ease: "power2.inOut" }, 12.135);
      words("#chat-cap1 span", 12.45); // last word lands 14.45
      words("#chat-cap2 span", 14.95); // last word lands 16.95
      // Held 2 s after the last word, then out (18.95–19.17).
      tl.to("#chat-content", { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, 18.95);
      window.__timelines["chat"] = tl;
    })();
  </script>
