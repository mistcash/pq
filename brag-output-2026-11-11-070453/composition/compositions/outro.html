  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#out-stage", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.32, ease: "power3.out" }, 0);
      tl.fromTo("#out-logo", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "pop" }, 0.02);
      // Words arrive at reading pace, 0.3 s apart (about 200 words a minute), and stay.

        tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.3, ease: "power2.out" }, at);
      words("#out-title span", 0.3); // last lands 1.7
      tl.fromTo("#out-eth", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "pop" }, 1.8);
      words("#out-sub span", 1.9); // last lands 2.7
      tl.fromTo("#out-cta", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "pop" }, 2.941);
      tl.fromTo(".out-pill", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "pop", stagger: 0.15 }, 3.12);

      // beat-grid: the button on beat 5, the tap and its confetti on beat 6 (53.25 global), then held still to the end.
      const TAP = 3.529;
      const cursor = document.getElementById("out-cursor");
      tl.fromTo(cursor, { x: 130, y: 90, opacity: 0 }, { x: 8, y: 5, opacity: 1, duration: 0.42, ease: "power2.inOut" }, TAP - 0.45);

      const box = document.getElementById("out-confetti");
      box.innerHTML = "<i></i>".repeat(14);
      [...box.children].forEach((el, i) => {
        const turn = i / 14, far = (7 + (i % 4) * 1.5) * 16, a = turn * Math.PI * 2;
        tl.set(el, { opacity: 1 }, TAP);
        tl.fromTo(el, { x: 0, y: 0, rotation: turn * 360, scale: 1 }, { x: far * Math.sin(a), y: -far * Math.cos(a), rotation: turn * 360 + 360, scale: 0.6, duration: 1.1, ease: "burst" }, TAP);
