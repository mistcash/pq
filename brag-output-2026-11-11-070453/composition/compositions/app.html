                  <div class="relative isolate">
                    <div id="app-confetti-2" class="confetti"></div>
                    <button id="app-send" class="btn btn-primary btn-lg btn-circle" disabled><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" /></svg></button>
                    <div id="app-cursor-2" class="app-cursor"><svg width="29" height="36" viewBox="0 0 23 29"><path d="M1.5 1.5v22.2l6-5.6 3.8 8.9 4.2-1.8-3.8-8.7h8.3z" fill="#081019" stroke="#fff" stroke-width="2" stroke-linejoin="round" /></svg></div>

  <script>
    document.fonts.ready.then(() => {
      const $ = id => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const pop = (target, at, origin = "50% 50%") =>
        tl.fromTo(target, { opacity: 0, scale: 0.5, transformOrigin: origin }, { opacity: 1, scale: 1, duration: 0.4, ease: "pop" }, at);
      const burst = (box, at) => {
        box.innerHTML = "<i></i>".repeat(14);
        [...box.children].forEach((el, i) => {
          const turn = i / 14, far = (7 + (i % 4) * 1.5) * 16, a = turn * Math.PI * 2;
          tl.set(el, { opacity: 1 }, at);
          tl.fromTo(el, { x: 0, y: 0, rotation: turn * 360, scale: 1 }, { x: far * Math.sin(a), y: -far * Math.cos(a), rotation: turn * 360 + 360, scale: 0.6, duration: 1.1, ease: "burst" }, at);
          tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.33, ease: "burst", immediateRender: false }, at + 0.77);
        });
      };
      // A cursor that glides in from (dx, dy), taps at `tap`, then leaves.
      const tapAt = (cursor, from, tap) => {
        const svg = cursor.firstElementChild;
        tl.fromTo(cursor, { x: from[0], y: from[1], opacity: 0 }, { x: 10, y: 6, opacity: 1, duration: 0.42, ease: "power2.inOut" }, tap - 0.45);
        tl.fromTo(svg, { scale: 1 }, { scale: 0.82, duration: 0.05, ease: "power2.out" }, tap);
        tl.to(svg, { scale: 1, duration: 0.1, ease: "power2.out" }, tap + 0.06);
        tl.to(cursor, { opacity: 0, x: 60, y: 50, duration: 0.15, ease: "power3.in" }, tap + 0.1);
      };

      // How far the app scrolls to show the composer, before and after the new bubble: the bottom of
      // "You said" + 16 px − the 560 px frame. Measured once with Fredoka loaded (the scene isn't laid
      // out while its timeline builds); re-measure if the app's markup changes.
      const scrollA = 350, scrollB = 370;

      // Words arrive at reading pace, 0.3 s apart (about 200 words a minute), and stay.
      const words = (sel, at) =>
        tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.3, ease: "power2.out" }, at);

      // In: the app slides in from the right, where the title left to the left.
      tl.fromTo("#app-wrap", { x: 160, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0);
      words("#app-left4 h2 span", 0.3);

      // "Only they can read what you write." gets its reading time, then Say hi is tapped on 29.00 (global, on the beat).
      tapAt($("app-cursor-1"), [150, 150], 3.02);
      tl.to("#app-sayhi", { scale: 0.96, duration: 0.05, ease: "power2.out" }, 3.02);
      tl.set("#app-pre", { display: "none" }, 3.07);
      tl.set("#app-busy", { display: "contents" }, 3.07);
      words("#app-math span", 3.2); // last word lands 5.8
      tl.fromTo(".app-dot", { opacity: 0.35, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.36, ease: "sine.inOut", yoyo: true, repeat: 12, stagger: 0.12 }, 3.07);
      // The avatar bounces, landing on every other beat: 30.60, 31.62, 32.65 and 33.67 (global).
      for (const [up, down] of [[3.07, 4.1], [4.615, 5.128], [5.641, 6.154], [6.667, 7.18]]) {
        tl.fromTo("#app-bouncer", { y: 0 }, { y: -32, duration: down - up, ease: "power3.out" }, up);
        tl.fromTo("#app-bouncer", { y: -32 }, { y: 0, duration: 0.513, ease: "power3.in", immediateRender: false }, down);
      }
      // beat-grid: chips 32.13 / 32.65 / 33.16 (global), after the secret-math line is read, then held.
      tl.fromTo(".app-chip", { opacity: 0, scale: 0.5, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "pop", stagger: 0.513 }, 6.154);

      // 33.67 (beat): connected, with time to read "They'll find your chat…".
      tl.set("#app-busy", { display: "none" }, 7.69);
      tl.set("#app-post", { display: "contents" }, 7.69);
      tl.set("#app-msgs", { display: "flex" }, 7.69);
      burst($("app-confetti-1"), 7.69);
      pop("#app-connected", 7.69);
      tl.fromTo("#app-find", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 7.97);

      // 36.78: the caption changes, the app scrolls to the composer.
      tl.to("#app-left4", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 10.8);
      words("#app-left5 h2 span", 11.2); // last word lands 13.2
      tl.fromTo("#app-scroll", { y: 0 }, { y: -scrollA, duration: 0.45, ease: "power2.inOut" }, 11.02);

      // Typing 37.58–38.58, the counter counting down, then sent on the beat at 38.80 (global).
      const typed = [..."here's the viewing key 🔑"];
      const input = $("app-input"), left = $("app-left"), send = $("app-send");
      const typing = { p: 0 };
      tl.fromTo(
        typing,
        { p: 0 },
        {
          p: 1,
          duration: 1.42,
          ease: "none",
          onUpdate() {
            const t = typing.p * 1.42;
            const text = typing.p <= 0 || typing.p >= 1 ? "" : typed.slice(0, Math.floor(Math.min(1, t / 1.0) * typed.length)).join("");
            input.value = text;
            left.textContent = 62 - new TextEncoder().encode(text).length;
            send.disabled = !text;
          },
        },
        11.6,
      );
      tapAt($("app-cursor-2"), [140, 110], 12.82);
      tl.to("#app-send", { scale: 0.92, duration: 0.05, ease: "power2.out" }, 12.82);
      tl.to("#app-send", { scale: 1, duration: 0.1, ease: "power2.out" }, 12.88);
      burst($("app-confetti-2"), 12.82);
      tl.set("#app-empty", { display: "none" }, 12.82);
      tl.set("#app-sent", { display: "grid" }, 12.82);
      pop("#app-sent-bubble", 12.82, "100% 100%");
      tl.to("#app-scroll", { y: -scrollB, duration: 0.2, ease: "power2.inOut" }, 12.82);

      // Held 2 s after the bubble lands, then out (41.43–41.68 global): the app leaves right, the caption blurs away.
      tl.to("#app-wrap", { x: 140, opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power3.in" }, 15.45);
      tl.to("#app-left5", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 15.47);
      window.__timelines["app"] = tl;
    });
  </script>
