name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/circuits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/circuits/go.mod
          cache-dependency-path: packages/circuits/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go test -tags purego ./...
